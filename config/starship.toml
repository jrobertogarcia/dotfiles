"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$kubernetes\
$cmd_duration\
$line_break\
$character"""

# Instant visual feedback
[fill]
symbol = " "

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[directory]
truncation_length = 4
truncation_symbol = "…/"
style = "bold cyan"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
conflicted = "🏳 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = ""
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "[$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "yellow bold"
format = '[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'

[rust]
symbol = "󱘗 "
style = "bold red"
format = "[$symbol($version )]($style)"

[golang]
symbol = "󰟓 "
style = "bold cyan"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "blue bold"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "
